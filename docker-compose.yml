services:
  api:
    build: .
    container_name: solar-api
    ports:
      - "8000:8000"
    environment:
      - SOLAR_DB_URL=sqlite:////app/data/solar.db
      - SOLAR_LOG_FILE=/app/data/logs/solar_pipeline.log
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  simulator:
    build: .
    container_name: solar-simulator
    depends_on:
      api:
        condition: service_healthy
    command:
      - python
      - -m
      - app.simulator
      - --base-url
      - http://api:8000
      - --interval
      - "5"
      - --cycles
      - "0"
